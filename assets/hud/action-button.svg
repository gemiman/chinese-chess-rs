  </defs>
  <circle cx="60" cy="60" r="50" fill="#ffbe45" opacity=".22" filter="url(#bglow)"/>
  <circle cx="60" cy="60" r="50" fill="url(#bt)"/>
  <circle cx="60" cy="60" r="50" fill="none" stroke="#e8c079" stroke-width="2.4"/>
  <circle cx="60" cy="60" r="50" fill="none" stroke="#fff0bd" stroke-width="1"

  <circle cx="60" cy="60" r="40" fill="url(#bin)"/>
  <circle cx="60" cy="60" r="40" fill="none" stroke="#c9a05a" stroke-width="1.2" opacity=".6"/>
  <path d="M 28 42 A 40 40 0 0 1 92 42" fill="none" stroke="#ffe9a8"
        stroke-width="2" opacity=".35" filter="url(#bglow)"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120"
     role="img" aria-label="操作按钮">
  <defs>
    <linearGradient id="bt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a6b3c"/>
      <stop offset=".35" stop-color="#5d452a"/>
      <stop offset="1" stop-color="#38281a"/>
    </linearGradient>
    <radialGradient id="bin" cx=".42" cy=".34" r=".8">
      <stop offset="0" stop-color="#241a10"/>
      <stop offset="1" stop-color="#120c06"/>
    </radialGradient>
    <filter id="bglow" x="-50%" y="-50%" width="200%" height="200%">

[package]
name = "xq-bridge"
description = "本地开发桥接服务：把 xq-core 规则内核暴露成 JSON API 并托管前端静态文件。**非产品组件**。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# 注意：本 crate 是开发工具，不属于领域层，因此不受 ADR-005 零 IO 约束。
# 它需要网络（本地监听）与 JSON 序列化，这两者都不允许出现在 xq-core 里。
[dependencies]
# 对局逻辑与会话/传输对象都在 xq-session 里 —— 本 crate 只负责 HTTP 这一层。
xq-session = { workspace = true }
xq-ai = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
